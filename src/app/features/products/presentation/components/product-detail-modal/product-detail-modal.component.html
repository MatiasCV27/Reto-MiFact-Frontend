@if (isOpen && product) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900/50 backdrop-blur-sm p-4 animate-fadeIn">
    <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full overflow-hidden border border-gray-100">
      <div class="px-6 py-4 bg-gray-50 border-b border-gray-100 flex justify-between items-center">
        <h3 class="text-lg font-bold text-gray-800">Detalles del Producto</h3>
        <button (click)="close()"
          class="text-gray-400 hover:text-gray-600 transition-colors p-1 rounded-lg">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="p-6 space-y-4">
        <div>
          <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Código</span>
          <p class="text-sm font-medium text-gray-900">{{ product.code }}</p>
        </div>
        <div>
          <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Nombre</span>
          <p class="text-base font-bold text-indigo-600">{{ product.name }}</p>
        </div>
        <div>
          <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Descripción</span>
          <p class="text-sm text-gray-600 bg-gray-50 p-3 rounded-lg border border-gray-100">
            {{ product.description }}
          </p>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Precio</span>
            <p class="text-lg font-bold text-emerald-600">{{ product.price | currency:'S/ ':'symbol':'1.2-2' }}</p>
          </div>
          <div>
            <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Stock</span>
            <p class="text-sm font-semibold text-gray-800">
              {{ product.stock }} unidades
            </p>
          </div>
        </div>
        <div>
          <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Categoría</span>
          <p class="mt-1">
            <span class="px-2.5 py-1 bg-indigo-50 text-indigo-700 rounded-md text-xs font-medium">
              {{ product.category }}
            </span>
          </p>
        </div>
      </div>

      <div class="px-6 py-3 bg-gray-50 border-t border-gray-100 flex justify-end">
        <button (click)="close()"
          class="px-4 py-2 bg-gray-800 hover:bg-gray-900 text-white text-sm font-medium rounded-lg transition-colors shadow-sm">
          Cerrar
        </button>
      </div>
    </div>
  </div>
}
